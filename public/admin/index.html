<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltron Auto — Admin Dashboard & Journal Manager</title>
    <style>
        :root {
            --bg-black: #080808;
            --card-bg: #141414;
            --border-color: #222222;
            --primary-red: #ff0000;
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--bg-black); color: var(--text-white); min-height: 100vh; }

        /* Login Screen */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 { font-size: 1.8rem; letter-spacing: 3px; margin-bottom: 8px; }
        .login-card p { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 25px; }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 11px 14px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary-red); }
        .form-textarea { resize: vertical; min-height: 120px; line-height: 1.5; }

        .btn-submit {
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }
        .btn-submit:hover { opacity: 0.9; }

        .btn-secondary {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover { background: #333; }

        .alert-error {
            background: rgba(255,0,0,0.15);
            border: 1px solid var(--primary-red);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }

        /* Dashboard Layout */
        .dashboard-container { display: none; }
        
        .dash-header {
            background: #000;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dash-logo { font-size: 1.3rem; letter-spacing: 3px; font-weight: bold; }
        .dash-logo span { color: var(--primary-red); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-gray);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-logout:hover { border-color: var(--primary-red); color: #fff; }

        .dash-body { padding: 40px 5%; max-width: 1400px; margin: 0 auto; }

        /* KPI Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
        }
        .stat-title { font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        .stat-val { font-size: 2.2rem; font-weight: bold; margin-top: 5px; color: #fff; }
        .stat-val.highlight { color: var(--primary-red); }

        /* Tabs Nav */
        .tab-nav {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--text-white);
            border-bottom-color: var(--primary-red);
        }

        /* Message Table / Cards */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .msg-list { display: flex; flex-direction: column; gap: 15px; }

        .msg-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-card.unread { border-left-color: var(--primary-red); }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .msg-author { font-weight: bold; font-size: 1.05rem; }
        .msg-email { color: var(--text-gray); font-size: 0.9rem; margin-left: 10px; }
        .msg-date { font-size: 0.75rem; color: var(--text-gray); }

        .msg-body {
            font-size: 0.95rem;
            color: #ddd;
            line-height: 1.6;
            background: #0a0a0a;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }

        .msg-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .btn-action {
            background: #000;
            border: 1px solid var(--border-color);
            color: #ccc;
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-action:hover { border-color: #666; color: #fff; }
        .btn-action.btn-danger:hover { border-color: var(--primary-red); color: #ff6b6b; }
        .btn-action.btn-archive:hover { border-color: #3b82f6; color: #60a5fa; }
        .btn-action.btn-edit:hover { border-color: #10b981; color: #34d399; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-gray);
            font-size: 0.95rem;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
        }

        /* Journal Specific UI */
        .journal-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .journal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .journal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.3s;
        }
        .journal-card:hover { border-color: #444; }

        .journal-card-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #111;
            display: block;
        }

        .journal-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .journal-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 3px;
            width: fit-content;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .badge-published { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-draft { background: rgba(156, 163, 175, 0.2); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.4); }

        .journal-card-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .journal-card-summary {
            font-size: 0.85rem;
            color: var(--text-gray);
            line-height: 1.5;
            margin-bottom: 15px;
            flex: 1;
        }

        .journal-card-meta {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 15px;
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: #101010;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 1.3rem; letter-spacing: 1px; }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close:hover { color: #fff; }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 15px 25px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            background: #0d0d0d;
        }

        .cover-preview {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 8px;
            background: #000;
            border: 1px solid var(--border-color);
            display: none;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .btn-tool {
            background: #1c1c1c;
            border: 1px solid var(--border-color);
            color: #ddd;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-tool:hover { background: #2a2a2a; color: #fff; }

        /* Quill Customization */
        .ql-toolbar.ql-snow { border-color: var(--border-color); background: #111; }
        .ql-container.ql-snow { border-color: var(--border-color); background: #000; color: #fff; font-size: 0.95rem; min-height: 250px; }
        .ql-snow .ql-stroke { stroke: #fff; }
        .ql-snow .ql-fill { fill: #fff; }
        .ql-snow .ql-picker { color: #fff; }
    </style>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="login-wrapper" id="login-wrapper">
        <div class="login-card">
            <h2>VELTRON <span>ADMIN</span></h2>
            <p>Enter your credentials to access dashboard</p>

            <div class="alert-error" id="login-error">Invalid credentials</div>

            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-input" required autocomplete="username" value="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div class="dashboard-container" id="dashboard-container">
        <header class="dash-header">
            <div class="dash-logo">VELTRON <span>CONSOLE</span></div>
            <button class="btn-logout" id="logout-btn">Logout</button>
        </header>

        <div class="dash-body">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Active Messages</div>
                    <div class="stat-val" id="stat-active">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Unread Tickets</div>
                    <div class="stat-val highlight" id="stat-unread">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Archived Messages</div>
                    <div class="stat-val" id="stat-archived">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Journal Articles</div>
                    <div class="stat-val highlight" id="stat-journal">0</div>
                </div>
            </div>

            <!-- Tab Nav -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="inbox">📩 Inbox (<span id="inbox-count">0</span>)</button>
                <button class="tab-btn" data-tab="archive">📦 Archive (<span id="archive-count">0</span>)</button>
                <button class="tab-btn" data-tab="journal">📝 Journal & News (<span id="journal-count">0</span>)</button>
            </div>

            <!-- TAB 1: INBOX -->
            <div class="tab-content active" id="tab-inbox">
                <div class="msg-list" id="inbox-list"></div>
            </div>

            <!-- TAB 2: ARCHIVE -->
            <div class="tab-content" id="tab-archive">
                <div class="msg-list" id="archive-list"></div>
            </div>

            <!-- TAB 3: JOURNAL MANAGER -->
            <div class="tab-content" id="tab-journal">
                <div class="journal-header-bar">
                    <h3 style="font-size: 1.1rem; color: #ccc;">Veltron Journal Articles & Releases</h3>
                    <button class="btn-submit" id="btn-new-article">+ Create New Article</button>
                </div>
                <div class="journal-grid" id="journal-list"></div>
            </div>

        </div>
    </div>

    <!-- 3. ARTICLE EDITOR MODAL -->
    <div class="modal-backdrop" id="article-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Create Journal Article</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="article-form">
                    <input type="hidden" id="edit-article-id">

                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="article-title" class="form-input" required placeholder="e.g. Next-Gen V-Force Propulsion Validation">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Slug (URL Identifier)</label>
                            <input type="text" id="article-slug" class="form-input" placeholder="e.g. next-gen-v-force-validation">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="article-category" class="form-select">
                                <option value="News">News</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Design">Design</option>
                                <option value="Concepts">Concepts</option>
                                <option value="Philosophy">Philosophy</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Cover Image (Upload file or enter URL)</label>
                        <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                            <input type="text" id="article-cover" class="form-input" placeholder="https://... or /uploads/image.webp">
                            <label class="btn-secondary" style="white-space: nowrap; cursor: pointer; display: flex; align-items: center;">
                                📁 Choose File
                                <input type="file" id="cover-file-input" accept="image/*" style="display:none;">
                            </label>
                        </div>
                        <img id="cover-preview-img" class="cover-preview" alt="Cover Preview">
                    </div>

                    <div class="form-group">
                        <label>Summary / Short Excerpt</label>
                        <textarea id="article-summary" class="form-textarea" style="min-height: 70px;" placeholder="Brief 1-2 sentence overview for the article card..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Content *</label>
                        <div id="quill-editor" style="height: 300px;"></div>
                        <input type="hidden" id="article-content">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label>Author</label>
                            <input type="text" id="article-author" class="form-input" value="Boris Vlajnić">
                        </div>
                        <div class="form-group">
                            <label>Publication Status</label>
                            <select id="article-status" class="form-select">
                                <option value="published">Published (Visible on site)</option>
                                <option value="draft">Draft (Hidden)</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="btn-cancel-modal">Cancel</button>
                <button type="button" class="btn-submit" id="btn-save-article">Save & Publish</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let authToken = localStorage.getItem('veltron_admin_token');

        const loginWrapper = document.getElementById('login-wrapper');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');

        if (authToken) { showDashboard(); } else { showLogin(); }

        function showLogin() {
            loginWrapper.style.display = 'flex';
            dashboardContainer.style.display = 'none';
        }

        function showDashboard() {
            loginWrapper.style.display = 'none';
            dashboardContainer.style.display = 'block';
            loadDashboardData();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.display = 'none';
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    localStorage.setItem('veltron_admin_token', authToken);
                    showDashboard();
                } else {
                    loginError.textContent = data.error || 'Invalid credentials.';
                    loginError.style.display = 'block';
                }
            } catch (err) {
                loginError.textContent = 'Server connection error.';
                loginError.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('veltron_admin_token');
            authToken = null;
            showLogin();
        });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                const target = btn.getAttribute('data-tab');
                document.getElementById(`tab-${target}`).classList.add('active');
            });
        });

        async function fetchAuth(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            };
            const res = await fetch(`${API_BASE}${url}`, options);
            if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('veltron_admin_token');
                authToken = null;
                showLogin();
                throw new Error('Unauthorized');
            }
            return res.json();
        }

        async function loadDashboardData() {
            try {
                const stats = await fetchAuth('/api/admin/stats');
                document.getElementById('stat-active').textContent = stats.messages.active || 0;
                document.getElementById('stat-unread').textContent = stats.messages.unread || 0;
                document.getElementById('stat-archived').textContent = stats.messages.archived || 0;
                document.getElementById('stat-journal').textContent = stats.journal.journal_count || 0;

                document.getElementById('inbox-count').textContent = stats.messages.active || 0;
                document.getElementById('archive-count').textContent = stats.messages.archived || 0;
                document.getElementById('journal-count').textContent = stats.journal.journal_count || 0;

                loadInbox();
                loadArchive();
                loadJournal();
            } catch (e) {
                console.error(e);
            }
        }

        // --- INBOX ---
        async function loadInbox() {
            const messages = await fetchAuth('/api/admin/messages');
            const container = document.getElementById('inbox-list');
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="empty-state">No incoming messages in inbox.</div>';
                return;
            }
            container.innerHTML = messages.map(msg => `
                <div class="msg-card ${msg.status === 'unread' ? 'unread' : ''}">
                    <div class="msg-header">
                        <div>
                            <span class="msg-author">${escapeHtml(msg.name)}</span>
                            <a href="mailto:${escapeHtml(msg.email)}" class="msg-email">${escapeHtml(msg.email)}</a>
                        </div>
                        <span class="msg-date">${new Date(msg.created_at).toLocaleString()}</span>
                    </div>
                    <div class="msg-body">${escapeHtml(msg.message)}</div>
                    <div class="msg-actions">
                        ${msg.status === 'unread' ? `<button class="btn-action" onclick="markAsRead(${msg.id})">✓ Mark Read</button>` : ''}
                        <button class="btn-action btn-archive" onclick="archiveMsg(${msg.id})">📦 Archive</button>
                        <button class="btn-action btn-danger" onclick="deleteMsg(${msg.id})">🗑 Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // --- ARCHIVE ---
        async function loadArchive() {
            const archived = await fetchAuth('/api/admin/archived');
            const container = document.getElementById('archive-list');
            if (!archived || archived.length === 0) {
                container.innerHTML = '<div class="empty-state">No archived messages.</div>';
                return;
            }
            container.innerHTML = archived.map(msg => `
                <div class="msg-card">
                    <div class="msg-header">
                        <div>
                            <span class="msg-author">${escapeHtml(msg.name)}</span>
                            <a href="mailto:${escapeHtml(msg.email)}" class="msg-email">${escapeHtml(msg.email)}</a>
                        </div>
                        <span class="msg-date">Archived: ${new Date(msg.archived_at || msg.created_at).toLocaleString()}</span>
                    </div>
                    <div class="msg-body">${escapeHtml(msg.message)}</div>
                    <div class="msg-actions">
                        <button class="btn-action" onclick="unarchiveMsg(${msg.id})">↩ Restore to Inbox</button>
                        <button class="btn-action btn-danger" onclick="deleteMsg(${msg.id})">🗑 Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function markAsRead(id) {
            await fetchAuth(`/api/admin/messages/${id}/status`, { method: 'POST', body: JSON.stringify({ status: 'read' }) });
            loadDashboardData();
        }
        async function archiveMsg(id) {
            await fetchAuth(`/api/admin/messages/${id}/archive`, { method: 'POST' });
            loadDashboardData();
        }
        async function unarchiveMsg(id) {
            await fetchAuth(`/api/admin/messages/${id}/unarchive`, { method: 'POST' });
            loadDashboardData();
        }
        async function deleteMsg(id) {
            if (confirm('Delete this message?')) {
                await fetchAuth(`/api/admin/messages/${id}`, { method: 'DELETE' });
                loadDashboardData();
            }
        }

        // --- JOURNAL MANAGEMENT ---
        async function loadJournal() {
            const posts = await fetchAuth('/api/admin/journal');
            const container = document.getElementById('journal-list');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">No journal articles yet. Click "+ Create New Article" to write your first story!</div>';
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="journal-card">
                    ${post.cover_image ? `<img src="${escapeHtml(post.cover_image)}" class="journal-card-cover" onerror="this.style.display='none'">` : ''}
                    <div class="journal-card-body">
                        <span class="journal-badge ${post.status === 'published' ? 'badge-published' : 'badge-draft'}">
                            ${post.status === 'published' ? '● Published' : '○ Draft'} · ${escapeHtml(post.category || 'General')}
                        </span>
                        <h4 class="journal-card-title">${escapeHtml(post.title)}</h4>
                        <p class="journal-card-summary">${escapeHtml(post.summary || '')}</p>
                        <div class="journal-card-meta">By ${escapeHtml(post.author || 'Veltron Team')} · ${new Date(post.created_at).toLocaleDateString()}</div>
                        <div class="msg-actions">
                            <button class="btn-action btn-edit" onclick="editArticle(${post.id})">✏ Edit</button>
                            <button class="btn-action btn-danger" onclick="deleteArticle(${post.id})">🗑 Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Modal Controls
        const articleModal = document.getElementById('article-modal');
        const modalTitle = document.getElementById('modal-title');
        const editIdInput = document.getElementById('edit-article-id');
        const titleInput = document.getElementById('article-title');
        const slugInput = document.getElementById('article-slug');
        const categoryInput = document.getElementById('article-category');
        const coverInput = document.getElementById('article-cover');
        const coverPreview = document.getElementById('cover-preview-img');
        const summaryInput = document.getElementById('article-summary');
        const contentInput = document.getElementById('article-content');
        const authorInput = document.getElementById('article-author');
        const statusInput = document.getElementById('article-status');

        let isDirty = false;
        
        // Initialize Quill Editor
        const quill = new Quill('#quill-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        // Track unsaved changes
        const setDirty = () => { isDirty = true; };
        document.getElementById('article-form').addEventListener('input', setDirty);
        quill.on('text-change', () => { isDirty = true; });

        function closeArticleModal() {
            if (isDirty && !confirm('You have unsaved changes. Are you sure you want to close?')) {
                return;
            }
            articleModal.style.display = 'none';
        }

        window.addEventListener('beforeunload', (e) => {
            if (isDirty && articleModal.style.display !== 'none') {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        document.getElementById('btn-new-article').addEventListener('click', () => {
            modalTitle.textContent = 'Create New Article';
            editIdInput.value = '';
            document.getElementById('article-form').reset();
            quill.root.innerHTML = '';
            coverPreview.style.display = 'none';
            authorInput.value = 'Boris Vlajnić';
            isDirty = false;
            articleModal.style.display = 'flex';
        });

        document.getElementById('modal-close').addEventListener('click', closeArticleModal);
        document.getElementById('btn-cancel-modal').addEventListener('click', closeArticleModal);

        // Auto-generate slug from title
        titleInput.addEventListener('input', () => {
            if (!editIdInput.value) {
                slugInput.value = titleInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            }
        });

        // Cover preview
        coverInput.addEventListener('input', () => {
            if (coverInput.value.trim()) {
                coverPreview.src = coverInput.value.trim();
                coverPreview.style.display = 'block';
            } else {
                coverPreview.style.display = 'none';
            }
        });

        // Cover File Upload
        document.getElementById('cover-file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = await uploadImageFile(file);
            if (url) {
                coverInput.value = url;
                coverPreview.src = url;
                coverPreview.style.display = 'block';
            }
        });

        // Quill Image Upload Handler
        quill.getModule('toolbar').addHandler('image', () => {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async () => {
                const file = input.files[0];
                if (!file) return;
                const url = await uploadImageFile(file);
                if (url) {
                    const range = quill.getSelection();
                    quill.insertEmbed(range.index, 'image', url);
                }
            };
        });

        async function uploadImageFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const base64Data = event.target.result;
                    try {
                        const res = await fetchAuth('/api/admin/upload', {
                            method: 'POST',
                            body: JSON.stringify({ image: base64Data, name: file.name })
                        });
                        if (res.success) {
                            resolve(res.url);
                        } else {
                            alert(res.error || 'Upload failed');
                            resolve(null);
                        }
                    } catch (err) {
                        alert('Failed to upload image');
                        resolve(null);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // Save Article
        document.getElementById('btn-save-article').addEventListener('click', async () => {
            const id = editIdInput.value;
            const payload = {
                title: titleInput.value,
                slug: slugInput.value,
                category: categoryInput.value,
                cover_image: coverInput.value,
                summary: summaryInput.value,
                content: quill.root.innerHTML,
                author: authorInput.value,
                status: statusInput.value
            };

            if (!payload.title || !payload.content || payload.content === '<p><br></p>') {
                alert('Title and Content are required.');
                return;
            }

            try {
                if (id) {
                    await fetchAuth(`/api/admin/journal/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                } else {
                    await fetchAuth('/api/admin/journal', { method: 'POST', body: JSON.stringify(payload) });
                }
                isDirty = false;
                articleModal.style.display = 'none';
                loadDashboardData();
            } catch (err) {
                alert('Error saving article: ' + err.message);
            }
        });

        // Edit Article
        async function editArticle(id) {
            const post = await fetchAuth(`/api/admin/journal/${id}`);
            if (!post) return;
            modalTitle.textContent = 'Edit Journal Article';
            editIdInput.value = post.id;
            titleInput.value = post.title;
            slugInput.value = post.slug;
            categoryInput.value = post.category || 'General';
            coverInput.value = post.cover_image || '';
            summaryInput.value = post.summary || '';
            quill.root.innerHTML = post.content || '';
            authorInput.value = post.author || 'Boris Vlajnić';
            statusInput.value = post.status || 'published';

            if (post.cover_image) {
                coverPreview.src = post.cover_image;
                coverPreview.style.display = 'block';
            } else {
                coverPreview.style.display = 'none';
            }

            isDirty = false;
            articleModal.style.display = 'flex';
        }

        async function deleteArticle(id) {
            if (confirm('Are you sure you want to delete this journal article?')) {
                await fetchAuth(`/api/admin/journal/${id}`, { method: 'DELETE' });
                loadDashboardData();
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
