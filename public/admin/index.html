<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltron Auto — Admin Dashboard</title>
    <style>
        :root {
            --bg-black: #080808;
            --card-bg: #141414;
            --border-color: #222222;
            --primary-red: #ff0000;
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--bg-black); color: var(--text-white); min-height: 100vh; }

        /* Login Screen */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 { font-size: 1.8rem; letter-spacing: 3px; margin-bottom: 8px; }
        .login-card p { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        .form-input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-input:focus { border-color: var(--primary-red); }

        .btn-submit {
            width: 100%;
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }
        .btn-submit:hover { opacity: 0.9; }

        .alert-error {
            background: rgba(255,0,0,0.15);
            border: 1px solid var(--primary-red);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }

        /* Dashboard Layout */
        .dashboard-container { display: none; }
        
        .dash-header {
            background: #000;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dash-logo { font-size: 1.3rem; letter-spacing: 3px; font-weight: bold; }
        .dash-logo span { color: var(--primary-red); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-gray);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-logout:hover { border-color: var(--primary-red); color: #fff; }

        .dash-body { padding: 40px 5%; max-width: 1400px; margin: 0 auto; }

        /* KPI Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
        }
        .stat-title { font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        .stat-val { font-size: 2.2rem; font-weight: bold; margin-top: 5px; color: #fff; }
        .stat-val.highlight { color: var(--primary-red); }

        /* Tabs Nav */
        .tab-nav {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--text-white);
            border-bottom-color: var(--primary-red);
        }

        /* Message Table / Cards */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .msg-list { display: flex; flex-direction: column; gap: 15px; }

        .msg-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-card.unread { border-left-color: var(--primary-red); }

        .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .msg-author { font-weight: bold; font-size: 1.05rem; }
        .msg-email { color: var(--text-gray); font-size: 0.9rem; margin-left: 10px; }
        .msg-date { font-size: 0.75rem; color: var(--text-gray); }

        .msg-body {
            font-size: 0.95rem;
            color: #ddd;
            line-height: 1.6;
            background: #0a0a0a;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }

        .msg-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .btn-action {
            background: #000;
            border: 1px solid var(--border-color);
            color: #ccc;
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-action:hover { border-color: #666; color: #fff; }
        .btn-action.btn-danger:hover { border-color: var(--primary-red); color: #ff6b6b; }
        .btn-action.btn-archive:hover { border-color: #3b82f6; color: #60a5fa; }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-gray);
            font-size: 0.95rem;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="login-wrapper" id="login-wrapper">
        <div class="login-card">
            <h2>VELTRON <span>ADMIN</span></h2>
            <p>Enter your credentials to access dashboard</p>

            <div class="alert-error" id="login-error">Invalid credentials</div>

            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-input" required autocomplete="username" value="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div class="dashboard-container" id="dashboard-container">
        <header class="dash-header">
            <div class="dash-logo">VELTRON <span>DASHBOARD</span></div>
            <button class="btn-logout" id="logout-btn">Logout</button>
        </header>

        <div class="dash-body">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Active Messages</div>
                    <div class="stat-val" id="stat-active">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Unread Tickets</div>
                    <div class="stat-val highlight" id="stat-unread">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Archived Messages</div>
                    <div class="stat-val" id="stat-archived">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Journal Posts</div>
                    <div class="stat-val" id="stat-journal">0</div>
                </div>
            </div>

            <!-- Tab Nav -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="inbox">📩 Inbox (<span id="inbox-count">0</span>)</button>
                <button class="tab-btn" data-tab="archive">📦 Archive (<span id="archive-count">0</span>)</button>
                <button class="tab-btn" data-tab="journal">📝 Journal (Future)</button>
            </div>

            <!-- TAB 1: INBOX -->
            <div class="tab-content active" id="tab-inbox">
                <div class="msg-list" id="inbox-list"></div>
            </div>

            <!-- TAB 2: ARCHIVE -->
            <div class="tab-content" id="tab-archive">
                <div class="msg-list" id="archive-list"></div>
            </div>

            <!-- TAB 3: JOURNAL (FUTURE) -->
            <div class="tab-content" id="tab-journal">
                <div class="empty-state">
                    <h3>📝 Journal Management Module</h3>
                    <p style="margin-top: 10px;">Ready for future blog/journal publication integration.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = '';
        let authToken = localStorage.getItem('veltron_admin_token');

        const loginWrapper = document.getElementById('login-wrapper');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');

        // Check Auth on init
        if (authToken) {
            showDashboard();
        } else {
            showLogin();
        }

        function showLogin() {
            loginWrapper.style.display = 'flex';
            dashboardContainer.style.display = 'none';
        }

        function showDashboard() {
            loginWrapper.style.display = 'none';
            dashboardContainer.style.display = 'block';
            loadDashboardData();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok && data.token) {
                    authToken = data.token;
                    localStorage.setItem('veltron_admin_token', authToken);
                    showDashboard();
                } else {
                    loginError.textContent = data.error || 'Invalid username or password.';
                    loginError.style.display = 'block';
                }
            } catch (err) {
                loginError.textContent = 'Server connection error.';
                loginError.style.display = 'block';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('veltron_admin_token');
            authToken = null;
            showLogin();
        });

        // Tabs Switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                const target = btn.getAttribute('data-tab');
                document.getElementById(`tab-${target}`).classList.add('active');
            });
        });

        async function fetchAuth(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${authToken}`,
                'Content-Type': 'application/json'
            };
            const res = await fetch(`${API_BASE}${url}`, options);
            if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('veltron_admin_token');
                authToken = null;
                showLogin();
                throw new Error('Unauthorized');
            }
            return res.json();
        }

        async function loadDashboardData() {
            try {
                // Fetch Stats
                const stats = await fetchAuth('/api/admin/stats');
                document.getElementById('stat-active').textContent = stats.messages.active || 0;
                document.getElementById('stat-unread').textContent = stats.messages.unread || 0;
                document.getElementById('stat-archived').textContent = stats.messages.archived || 0;
                document.getElementById('stat-journal').textContent = stats.journal.journal_count || 0;

                document.getElementById('inbox-count').textContent = stats.messages.active || 0;
                document.getElementById('archive-count').textContent = stats.messages.archived || 0;

                // Load Messages
                loadInbox();
                loadArchive();
            } catch (e) {
                console.error(e);
            }
        }

        async function loadInbox() {
            const messages = await fetchAuth('/api/admin/messages');
            const container = document.getElementById('inbox-list');
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="empty-state">No incoming messages in inbox.</div>';
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="msg-card ${msg.status === 'unread' ? 'unread' : ''}">
                    <div class="msg-header">
                        <div>
                            <span class="msg-author">${escapeHtml(msg.name)}</span>
                            <a href="mailto:${escapeHtml(msg.email)}" class="msg-email">${escapeHtml(msg.email)}</a>
                        </div>
                        <span class="msg-date">${new Date(msg.created_at).toLocaleString()}</span>
                    </div>
                    <div class="msg-body">${escapeHtml(msg.message)}</div>
                    <div class="msg-actions">
                        ${msg.status === 'unread' ? `<button class="btn-action" onclick="markAsRead(${msg.id})">✓ Mark Read</button>` : ''}
                        <button class="btn-action btn-archive" onclick="archiveMsg(${msg.id})">📦 Archive</button>
                        <button class="btn-action btn-danger" onclick="deleteMsg(${msg.id})">🗑 Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function loadArchive() {
            const archived = await fetchAuth('/api/admin/archived');
            const container = document.getElementById('archive-list');
            if (!archived || archived.length === 0) {
                container.innerHTML = '<div class="empty-state">No archived messages.</div>';
                return;
            }

            container.innerHTML = archived.map(msg => `
                <div class="msg-card">
                    <div class="msg-header">
                        <div>
                            <span class="msg-author">${escapeHtml(msg.name)}</span>
                            <a href="mailto:${escapeHtml(msg.email)}" class="msg-email">${escapeHtml(msg.email)}</a>
                        </div>
                        <span class="msg-date">Archived: ${new Date(msg.archived_at || msg.created_at).toLocaleString()}</span>
                    </div>
                    <div class="msg-body">${escapeHtml(msg.message)}</div>
                    <div class="msg-actions">
                        <button class="btn-action" onclick="unarchiveMsg(${msg.id})">↩ Restore to Inbox</button>
                        <button class="btn-action btn-danger" onclick="deleteMsg(${msg.id})">🗑 Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function markAsRead(id) {
            await fetchAuth(`/api/admin/messages/${id}/status`, {
                method: 'POST',
                body: JSON.stringify({ status: 'read' })
            });
            loadDashboardData();
        }

        async function archiveMsg(id) {
            await fetchAuth(`/api/admin/messages/${id}/archive`, { method: 'POST' });
            loadDashboardData();
        }

        async function unarchiveMsg(id) {
            await fetchAuth(`/api/admin/messages/${id}/unarchive`, { method: 'POST' });
            loadDashboardData();
        }

        async function deleteMsg(id) {
            if (confirm('Are you sure you want to delete this message?')) {
                await fetchAuth(`/api/admin/messages/${id}`, { method: 'DELETE' });
                loadDashboardData();
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
